[project]
name = "vela"
version = "0.4.0"
description = "VELA — Vigilant Egress & Leak Analyst: tu identidad de red (VPN, proxies, Tor, DNS, fugas), siempre en vela"
readme = "README.md"
license = {text = "Proprietary — All rights reserved; written permission required"}
requires-python = ">=3.10"
dependencies = []          # el núcleo usa solo la biblioteca estándar
classifiers = [
    "License :: Other/Proprietary License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
geo = ["geoip2"]           # ciudad y ASN con bases .mmdb locales
crypto = ["sqlcipher3"]    # cifrado real de la base de datos

[project.scripts]
vela = "vela.cli:main"
velad = "vela.daemon:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vela*"]

[tool.setuptools]
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.package-data]
"vela.gui" = ["static/*"]
"vela" = ["data/*", "data/brand/*", "locale/*.json"]   # iconos, avatar, mapa base OSM (ODbL) y traducciones
