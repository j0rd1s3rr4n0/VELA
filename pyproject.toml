[project]
name = "vela"
version = "0.3.0"
description = "VELA — Vigilant Egress & Leak Analyst: tu identidad de red (VPN, proxies, Tor, DNS, fugas), siempre en vela"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []          # el núcleo usa solo la biblioteca estándar

[project.optional-dependencies]
geo = ["geoip2"]           # ciudad y ASN con bases .mmdb locales
crypto = ["sqlcipher3"]    # cifrado real de la base de datos

[project.scripts]
vela = "vela.cli:main"
velad = "vela.daemon:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vela*"]

[tool.setuptools.package-data]
"vela.gui" = ["static/*"]
"vela" = ["data/*"]   # icono y mapa base de OpenStreetMap incorporado (ODbL)
