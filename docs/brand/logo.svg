<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>VELA — Vigilant Egress &amp; Leak Analyst</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2029"/>
      <stop offset="1" stop-color="#0f1115"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2f6fd0"/>
      <stop offset="0.55" stop-color="#3987e5"/>
      <stop offset="1" stop-color="#8cc4ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="64" cy="70" r="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3987e5" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3987e5" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect x="4.5" y="4.5" width="119" height="119" rx="27.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <circle cx="64" cy="70" r="46" fill="url(#glow)"/>
  <!-- arco de vigilancia -->
  <path d="M30 92 A40 40 0 0 1 30 44" fill="none" stroke="#3987e5" stroke-opacity="0.45" stroke-width="3" stroke-linecap="round"/>
  <path d="M98 44 A40 40 0 0 1 98 92" fill="none" stroke="#3987e5" stroke-opacity="0.45" stroke-width="3" stroke-linecap="round"/>
  <!-- llama -->
  <path d="M64 18 C66 32 86 46 86 70 C86 88 76 100 64 100 C52 100 42 88 42 70 C42 58 48 50 54 42
           C55 50 58 55 62 57 C60 44 60 30 64 18 Z" fill="url(#flame)"/>
  <!-- núcleo -->
  <path d="M64 62 C69 70 74 75 74 84 C74 91 69.5 96 64 96 C58.5 96 54 91 54 84 C54 76 59 71 64 62 Z"
        fill="#eaf4ff"/>
  <!-- mecha / horizonte -->
  <rect x="52" y="104" width="24" height="4" rx="2" fill="#3987e5" fill-opacity="0.8"/>
</svg>
